# Tiene sveglia l'API.
#
# Perche' serve: sui piani gratuiti (Render, Railway) il container viene spento
# dopo ~15 minuti senza traffico. La visita successiva deve aspettare che si
# riaccenda: sono 30-60 secondi in cui il sito sembra rotto. Questo ping ogni
# 5 minuti evita lo spegnimento.
#
# PERCHE' OGNI 5 E NON OGNI 10: GitHub NON garantisce la puntualita' dei
# cron — nei momenti di carico un giro puo' ritardare anche di 10-15 minuti
# (documentato da GitHub stesso). Con un intervallo di 10 minuti, un solo
# ritardo bastava a far scattare comunque lo spegnimento di Render: 5 minuti
# lascia molto piu' margine prima che si arrivi ai ~15 minuti di inattivita'.
#
# QUESTO NON E' UNA GARANZIA AL 100%: resta un cron "a tentativi", non un
# server che non si spegne mai. Se un giorno vuoi la garanzia vera, le uniche
# due strade sono un piano Render a pagamento (nessun spin-down, e' l'unica
# soluzione definitiva) oppure un servizio di ping esterno come UptimeRobot o
# cron-job.org, piu' puntuale di GitHub Actions perche' non condivide la
# stessa coda di runner. Se passi al piano a pagamento questo workflow non
# serve piu' e puoi cancellarlo.

name: Keep API warm

on:
  schedule:
    # Ogni 5 minuti: vedi il commento sopra sul perche' non ogni 10.
    - cron: "*/5 * * * *"
  # Permette di lanciarlo a mano dalla tab Actions
  workflow_dispatch:

# Evita che due ping si accavallino
concurrency:
  group: keep-api-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          URL="https://apiprojectheroicsite.onrender.com/health"

          # --max-time 90: se il container era spento deve avere il tempo di
          # riaccendersi, altrimenti il ping fallisce proprio quando serviva.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL")
          echo "HTTP $code da $URL"

          if [ "$code" != "200" ]; then
            echo "::warning::L'API ha risposto $code invece di 200"
            exit 1
          fi

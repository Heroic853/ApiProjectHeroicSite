<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- ==========================================================
         DATI PER I MOTORI DI RICERCA
         ==========================================================
         Prima qui non c'era niente oltre al title: nessuna description,
         nessun Open Graph. Google e Bing non avevano nulla da mostrare nei
         risultati, e condividendo il link su WhatsApp o Discord non usciva
         nessuna anteprima.

         Il titolo contiene le parole che una persona cerca davvero
         ("Monster Hunter mods"), non solo il nome del sito. -->
    <title>Heroic853 — Monster Hunter Mods, Custom Monsters &amp; Commissions</title>

    <meta name="description"
          content="Custom Monster Hunter mods by Heroic853: reworked monsters for World Iceborne, Rise Sunbreak and Wilds, with 4K textures, custom quests, effects and video montages. Browse the mod gallery or commission your own monster." />

    <meta name="keywords"
          content="Monster Hunter mods, Monster Hunter World Iceborne mods, Monster Hunter Rise Sunbreak mods, Monster Hunter Wilds mods, custom monster mod, Alatreon mod, Fatalis mod, Nargacuga mod, Heroic853" />

    <meta name="author" content="Heroic853" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0d0500" />

    <!-- Dice a Google quale indirizzo e' quello "ufficiale" della pagina -->
    <link rel="canonical" href="https://heroic853.github.io/Heroic853SiteV1/" />

    <!-- Open Graph: l'anteprima quando il link viene incollato su
         WhatsApp, Discord, Facebook, Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Heroic853" />
    <meta property="og:title" content="Heroic853 — Monster Hunter Mods &amp; Custom Monsters" />
    <meta property="og:description"
          content="Custom Monster Hunter mods: reworked monsters with 4K textures, custom quests and effects. Browse the gallery or commission your own." />
    <meta property="og:url" content="https://heroic853.github.io/Heroic853SiteV1/" />
    <meta property="og:image" content="https://heroic853.github.io/Heroic853SiteV1/images/Heroic853Icon.webp" />

    <!-- Anteprima su X/Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Heroic853 — Monster Hunter Mods" />
    <meta name="twitter:description"
          content="Custom Monster Hunter mods: reworked monsters, 4K textures, custom quests and effects." />
    <meta name="twitter:image" content="https://heroic853.github.io/Heroic853SiteV1/images/Heroic853Icon.webp" />

    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Client.styles.css" rel="stylesheet" />

    <!-- ==========================================================
         DECODIFICA URL PER GITHUB PAGES — NON RIMUOVERE
         ==========================================================
         GitHub Pages non conosce le rotte di Blazor: se qualcuno apre
         direttamente /newmods, o se Auth0 rimanda a
         /authentication/login-callback, Pages risponde 404 e serve il
         file 404.html.

         Quel file trasforma l'indirizzo in
             /Heroic853SiteV1/?/newmods
             /Heroic853SiteV1/?/authentication/login-callback&code=...~and~state=...
         per poter arrivare comunque all'app.

         Ma qualcuno deve fare il lavoro inverso, e mancava: Blazor
         leggeva il percorso "/" e mostrava la home. Di conseguenza
         nessun link diretto funzionava e IL LOGIN NON POTEVA COMPLETARSI,
         perche' il "code" di Auth0 non raggiungeva mai il gestore OIDC.

         Questo script ricostruisce l'indirizzo vero con replaceState
         PRIMA che Blazor parta (per questo sta nell'head, non a fine body).
         -->
    <script type="text/javascript">
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&');
                }).join('?');

                window.history.replaceState(
                    null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location));
    </script>
</head>

<body>
    <!-- Il contenuto di #app viene sostituito da Blazor quando l'app parte.
         Fino a quel momento e' l'unica cosa che esiste nella pagina, ed e'
         anche l'unica che vedono i motori di ricerca che non eseguono
         JavaScript (Bing, quindi Edge, e le anteprime dei social).

         Prima qui c'era solo "Loading Assets...", cioe' zero informazioni.
         Il testo qui sotto e' lo stesso che vede l'utente: nessun trucco,
         solo contenuto reale mostrato per un attimo. -->
    <div id="app">
        <div class="heroic-loader">
            <div class="loader-content">
                <div class="dragon-pulse"></div>
                <h1 class="loader-title">Heroic853 — Monster Hunter Mods</h1>
                <div class="loader-bar">
                    <div class="loader-progress"></div>
                </div>
                <p class="loader-text">Loading Assets...</p>
                <p class="loader-about">
                    Custom Monster Hunter monsters for World Iceborne, Rise Sunbreak
                    and Wilds: 4K textures, custom quests, effects and video montages.
                </p>
            </div>
        </div>
    </div>

    <!-- Per chi ha JavaScript disattivato e per i crawler piu' semplici:
         almeno il sito si presenta e offre dei link da seguire. -->
    <noscript>
        <div style="max-width:640px;margin:40px auto;padding:24px;color:#e0e0e0;font-family:Georgia,serif;">
            <h1 style="color:#ffd700;">Heroic853 — Monster Hunter Mods</h1>
            <p>
                This site showcases custom Monster Hunter monster mods for
                Monster Hunter World Iceborne, Monster Hunter Rise Sunbreak and
                Monster Hunter Wilds: reworked monsters with 4K textures, custom
                quests, custom effects, custom icons and video montages.
            </p>
            <p>
                It needs JavaScript to run. In the meantime you can find the mods
                and the videos here:
            </p>
            <ul>
                <li><a style="color:#d4af37;" href="https://www.nexusmods.com/profile/Heroic853">Mods on Nexus Mods</a></li>
                <li><a style="color:#d4af37;" href="https://www.youtube.com/channel/UCm-gjwogiS1Nf6L2hoI5sJA">Videos on YouTube</a></li>
                <li><a style="color:#d4af37;" href="https://github.com/Heroic853">GitHub</a></li>
            </ul>
        </div>
    </noscript>

    <style>
        .heroic-loader {
            background-color: #0d0500;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
        }

        .loader-content {
            text-align: center;
        }

        .dragon-pulse {
            width: 80px;
            height: 80px;
            background: #8b0000;
            margin: 0 auto 20px;
            border-radius: 50%;
            box-shadow: 0 0 20px #ff4500;
            animation: pulse 1.5s infinite ease-in-out;
            border: 2px solid #ffd700;
        }

        .loader-title {
            color: #ffd700;
            font-size: 1.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .loader-bar {
            width: 200px;
            height: 4px;
            background: rgba(139, 0, 0, 0.3);
            border-radius: 2px;
            margin: 0 auto;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .loader-progress {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #8b0000, #ffd700);
            box-shadow: 0 0 10px #ffd700;
            animation: loading-flow 2s infinite linear;
        }

        .loader-text {
            color: #c0c0c0;
            font-size: 0.8rem;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        /* Descrizione del sito: e' qui per i motori di ricerca, ma resta
           leggibile anche dall'utente durante il caricamento. */
        .loader-about {
            max-width: 420px;
            margin: 18px auto 0;
            padding: 0 16px;
            color: #8a8a8a;
            font-family: Georgia, serif;
            font-size: 0.78rem;
            line-height: 1.6;
            letter-spacing: 0;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.9);
                box-shadow: 0 0 0px #8b0000;
            }

            50% {
                transform: scale(1);
                box-shadow: 0 0 30px #ff4500;
            }

            100% {
                transform: scale(0.9);
                box-shadow: 0 0 0px #8b0000;
            }
        }

        @keyframes loading-flow {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(250%);
            }
        }
    </style>

    <div id="blazor-error-ui">
        An shit error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
    <!-- Funzioni JS chiamate da Blazor (playSound). Va caricato PRIMA di
         blazor.webassembly.js, altrimenti al primo click la funzione
         potrebbe non essere ancora definita. -->
    <script src="js/site.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>

</body>

</html>
